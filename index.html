<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatrixLab — Álgebra lineal paso a paso</title>
  <meta name="description" content="Calculadora de matrices paso a paso: Gauss-Jordan, sistemas de ecuaciones, determinantes, cofactores e inversa con fracciones exactas.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee.
    try {
      var saved = localStorage.getItem("matrixlab.theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235a2ca0'/%3E%3Cpath d='M22 14h-8v36h8M42 14h8v36h-8' fill='none' stroke='white' stroke-width='4'/%3E%3Crect x='25' y='24' width='14' height='14' rx='3' fill='%23ffd84a'/%3E%3C/svg%3E">
  <!-- Tipografías (mejora opcional: sin conexión se usan las del sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:1rem">MatrixLab necesita JavaScript activado.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
